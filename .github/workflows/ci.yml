name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.x']
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      # Lint is advisory until the 158 pre-existing errors are worked down.
      # Flip this to blocking once npx eslint . is clean.
      - run: npm run lint
        continue-on-error: true
      - run: npm run audit
      - run: npm run test:unit
      - run: npm run build
